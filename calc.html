<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <link rel="stylesheet" href="calc.css">
</head>
<body>
    <section class="calcbody">
        <div class="notch"></div>
        <div class="screen">
            <div class="history" id="history"></div>
            <div class="display" id="display">0</div>
        </div>
        <div class="firstrow">
            <button class="cbutton">CLR</button>
            <h1>VIDAFA</h1>
            <button class="delbutton">DEL</button>
        </div>
        <div class="secondrow">
            <button class="number b1">1</button>
            <button class="number b2">2</button>
            <button class="number b3">3</button>
            <button class="number b4">4</button>
            <button class="number b5">5</button>
            <button class="number b6">6</button>
            <button class="number b7">7</button>
            <button class="number b8">8</button>
            <button class="number b9">9</button>
            <button class="solve bmul">x</button>
            <button class="number bzero">0</button>
            <button class="solve badd">+</button>
            <button class="solve bmin">-</button>
            <button class="solve bdiv">/</button>
            <button class="solve bequ">=</button>
        </div>
    </section>
    <script src="calc.js"></script>
</body>

</html>
